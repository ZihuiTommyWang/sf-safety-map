    <script type="application/ld+json">

          "description": "A free, open-source San Francisco crime and safety map. Search any SF address and see real SFPD incident reports nearby, filterable by crime type and time window, updated nightly.",
          "applicationCategory": "Map",
          "operatingSystem": "Any",
          "isAccessibleForFree": true,
          "creator": { "@type": "Person", "name": "Tommy Wang" }

        {
          "@type": "Dataset",
          "name": "San Francisco Safety Incidents (processed)",

        }
      ]
    }
