<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>San Francisco Safety Map — Crime Map, Updated Nightly</title>
    <meta
      name="description"
      content="A free, open-source San Francisco crime and safety map. Search any SF address and see real SFPD incident reports nearby — 150,000+ incidents from the last 3 years, filterable by crime type, updated nightly. No ads, no tracking."
    />
    <link rel="canonical" href="https://citysafetymap.com/sf/" />
    <meta name="theme-color" content="#101216" />
    <link rel="icon" type="image/svg+xml" href="/sf/favicon.svg" />
    <link rel="apple-touch-icon" href="/sf/apple-touch-icon.png" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="San Francisco Safety Map" />
    <meta property="og:title" content="San Francisco Safety Map — Crime Map" />
    <meta
      property="og:description"
      content="Search any SF address and see real SFPD incident reports nearby. 150,000+ incidents, updated nightly. Free, open source, no ads."
    />
    <meta property="og:url" content="https://citysafetymap.com/sf/" />
    <meta property="og:image" content="https://citysafetymap.com/sf/og.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:description"
      content="Search any SF address and see real SFPD incident reports nearby. Updated nightly. Free, no ads."
    />
    <meta name="twitter:image" content="https://citysafetymap.com/sf/og.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "San Francisco Safety Map",
          "url": "https://citysafetymap.com/sf/",
          "description": "A free, open-source San Francisco crime and safety map. Search any SF address and see real SFPD incident reports nearby, filterable by crime type and time window, updated nightly.",
          "applicationCategory": "Map",
          "operatingSystem": "Any",
          "isAccessibleForFree": true,
          "creator": { "@type": "Person", "name": "Tommy Wang" }
        },
        {
          "@type": "Dataset",
          "name": "San Francisco Safety Incidents (processed)",
          "description": "SFPD incident reports from the last 3 years, filtered to place-based safety incidents and grouped into 13 categories. Derived nightly from DataSF's Police Department Incident Reports dataset.",
          "url": "https://citysafetymap.com/sf/",
          "isBasedOn": "https://data.sf.gov/d/wg3w-h783",
          "license": "https://opendatacommons.org/licenses/pddl/1-0/",
          "spatialCoverage": "San Francisco, California",
          "distribution": {
            "@type": "DataDownload",
            "encodingFormat": "application/json",
            "contentUrl": "https://citysafetymap.com/sf/data/incidents.json"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Where does the San Francisco Safety Map get its data?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Real SFPD incident reports via DataSF, San Francisco's open data portal, refreshed nightly."
              }
            },
            {
              "@type": "Question",
              "name": "What crimes are shown on the map?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Crimes are grouped into 13 categories, like assault, robbery, theft, car break-ins, vehicle theft, and burglary. Paperwork-only records, fraud, and shoplifting are left out."
              }
            },
            {
              "@type": "Question",
              "name": "Are incident locations exact?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Locations are anonymized by SFPD to the block level, so a dot marks a block, not an exact address."
              }
            },
            {
              "@type": "Question",
              "name": "Do more dots mean an area is dangerous?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Not always. More reports don't always mean more danger. Busy areas simply report more."
              }
            },
            {
              "@type": "Question",
              "name": "Is the San Francisco Safety Map free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Free, open source, no ads, no tracking."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>

    <div id="root"></div>
