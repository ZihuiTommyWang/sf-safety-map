<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Report Card Lab — SF Safety Map</title>
<style>
  :root { --glass: rgba(26,28,35,.92); --line: rgba(255,255,255,.12); --txt:#f2f3f5; --dim:#9aa0a6; --amber:#ffb84d; --good:#7ddf8a; --bad:#ef5350; }
  html, body { margin:0; min-height:100%; background:#101216 radial-gradient(1200px 600px at 50% -100px, #1a2030, #101216); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  h1 { text-align:center; font-size:14px; font-weight:600; color:var(--dim); margin:24px 16px 4px; }
  .sub { text-align:center; font-size:12px; color:#6b7076; margin-bottom:20px; }
  .row { display:flex; gap:22px; justify-content:center; align-items:flex-start; flex-wrap:wrap; padding:0 20px 40px; }
  .card { width:330px; background:var(--glass); border:1px solid var(--line); border-radius:20px;
    box-shadow:0 18px 50px rgba(0,0,0,.55); overflow:hidden; }
  .lab { text-align:center; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--amber); margin:14px 0 10px; }
  .hd { display:flex; justify-content:space-between; align-items:flex-start; padding:0 16px 10px; }
  .hd strong { font-size:14.5px; }
  .hd .x { color:var(--dim); }
  .hd .sub2 { font-size:11px; color:var(--dim); font-weight:400; display:block; margin-top:1px; }
  .list { border-top:1px solid rgba(255,255,255,.07); }
  .li { border-top:1px solid rgba(255,255,255,.04); cursor:pointer; }
  .li .head { display:flex; gap:10px; padding:10px 16px; align-items:flex-start; }
  .li .head:hover { background:rgba(255,255,255,.04); }
  .dot { width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0; }
  .li .t { font-size:12.5px; line-height:1.3; }
  .li .m { font-size:11px; color:var(--dim); margin-top:1px; }
  .li .m b { color:#cdd1d5; font-weight:500; }
  .li .car { margin-left:auto; color:var(--dim); font-size:10px; transition:transform .15s; margin-top:4px; }
  .li.open .car { transform:rotate(90deg); }
  .li .detail { display:none; padding:2px 16px 12px 35px; }
  .li.open .detail { display:block; animation:fade .18s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(-3px)} to{opacity:1} }
  .dgrid { display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:11.5px; }
  .dgrid span { color:var(--dim); }
  .dgrid b { font-weight:500; color:#e3e5e8; }
  .more { padding:9px 16px; font-size:12px; color:var(--dim); border-top:1px solid rgba(255,255,255,.05); }

  /* A tiles */
  .tiles { display:flex; gap:10px; padding:0 16px 14px; }
  .tile { flex:1; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:11px 13px; }
  .tile b { display:block; font-size:23px; font-weight:750; letter-spacing:-.4px; }
  .tile span { font-size:10.5px; color:var(--dim); }

  /* B one-liner */
  .oneliner { padding:0 16px 14px; font-size:14px; line-height:1.5; }
  .oneliner b { color:var(--txt); font-weight:700; }
  .oneliner .mult { font-weight:700; }

  /* C hero */
  .hero { text-align:center; padding:2px 16px 14px; }
  .hero .big { font-size:52px; font-weight:800; letter-spacing:-2px; line-height:1; }
  .hero .cap { font-size:11px; color:var(--dim); margin-top:2px; }
  .hero .pill { display:inline-block; margin-top:9px; font-size:12.5px; font-weight:600;
    padding:5px 14px; border-radius:999px; border:1px solid; }

  /* D bars */
  .cmp { padding:0 16px 14px; }
  .cmp .r { display:flex; align-items:center; gap:10px; font-size:11.5px; margin-bottom:8px; }
  .cmp .nm { width:88px; color:var(--dim); flex-shrink:0; }
  .cmp .tr { flex:1; height:16px; border-radius:5px; background:rgba(255,255,255,.06); overflow:hidden; }
  .cmp .tr i { display:block; height:100%; border-radius:5px; }
  .cmp .v { width:36px; font-weight:700; text-align:right; }
</style>
</head>
<body>
<h1>Count · vs city average · recent list — tap any incident to expand</h1>
<div class="sub">A · Tiles &nbsp;&nbsp; B · One-liner &nbsp;&nbsp; C · Hero number &nbsp;&nbsp; D · Comparison bars</div>
<div class="row" id="row"></div>

<script>
const CENTER = { lng: -122.39354, lat: 37.78583, label: '515 Harrison St', nh: 'Financial District/South Beach' }
const R = 300
const LAT0 = 37.768, LNG0 = -122.435
const MX = 111320 * Math.cos(LAT0 * Math.PI / 180), MY = 110540
const CAT_COLORS = { 'assault':'#ef5350','homicide':'#b71c1c','robbery':'#ff7043','sex-offenses':'#c2185b','weapons':'#ec407a','drugs':'#7e57c2','street-disorder':'#26a69a','theft':'#ffca28','car-break-in':'#ffa726','vehicle-theft':'#ff8a65','burglary':'#ab47bc','vandalism':'#66bb6a','arson':'#d84315' }
const fmtH = h => h>=24?'time not recorded':h===0?'12 AM':h<12?h+' AM':h===12?'12 PM':(h-12)+' PM'

async function main() {
  const [inc, meta] = await Promise.all([
    fetch('data/incidents.json').then(r=>r.json()),
    fetch('data/meta.json').then(r=>r.json()),
  ])
  const cx=(CENTER.lng-LNG0)*MX, cy=(CENTER.lat-LAT0)*MY, r2=R*R
  const items=[]
  for(let i=0;i<inc.n;i++){
    const dx=(inc.lng[i]-LNG0)*MX-cx, dy=(inc.lat[i]-LAT0)*MY-cy
    const d2=dx*dx+dy*dy
    if(d2<=r2)items.push({i,dist:Math.round(Math.sqrt(d2))})
  }
  items.sort((a,b)=>inc.day[b.i]-inc.day[a.i])
  const count=items.length
  const mult=(count/(Math.PI*r2))/(inc.n/121e6)
  const typical=Math.round(count/mult)
  const multColor=mult<1?'var(--good)':mult<2.5?'var(--amber)':'var(--bad)'

  const relDay=d=>{const n=meta.maxDay-d;return n<=0?'today':n===1?'yesterday':n<60?n+' days ago':new Date(Date.UTC(2018,0,1)+d*86400000).toISOString().slice(0,10)}
  const isoDay=d=>new Date(Date.UTC(2018,0,1)+d*86400000).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'})
  const header=`<div class="hd"><strong>${CENTER.label}<span class="sub2">${CENTER.nh} · within 300 m · last 12 months</span></strong><span class="x">✕</span></div>`

  const listHtml=(n,openFirst)=>items.slice(0,n).map(({i,dist},k)=>{
    const cat=meta.categories[inc.cat[i]]
    const resRaw=inc.resolutions[inc.res[i]]
    return `<div class="li${openFirst&&k===0?' open':''}" onclick="this.classList.toggle('open')">
      <div class="head"><span class="dot" style="background:${CAT_COLORS[cat.id]}"></span>
        <div><div class="t">${inc.descs[inc.desc[i]]}</div>
        <div class="m"><b>${relDay(inc.day[i])}</b> · ${dist} m away</div></div>
        <span class="car">▶</span></div>
      <div class="detail"><div class="dgrid">
        <span>Category</span><b>${cat.label}</b>
        <span>Date</span><b>${isoDay(inc.day[i])}</b>
        <span>Time</span><b>${fmtH(inc.hour[i])}</b>
        <span>Outcome</span><b>${resRaw.includes('Open')?'Unresolved (open or active)':resRaw}</b>
        <span>Distance</span><b>${dist} m from this spot</b>
      </div></div></div>`}).join('')
  const more=`<div class="more">…and ${count-5} more — scroll ↓</div>`

  const row=document.getElementById('row')

  // A — tiles
  row.insertAdjacentHTML('beforeend', `<div class="card"><p class="lab">A · Tiles</p>${header}
    <div class="tiles">
      <div class="tile"><b>${count}</b><span>incidents · 300 m</span></div>
      <div class="tile"><b style="color:${multColor}">${mult.toFixed(1)}×</b><span>the city average</span></div>
    </div>
    <div class="list">${listHtml(5,true)}${more}</div></div>`)

  // B — one-liner
  row.insertAdjacentHTML('beforeend', `<div class="card"><p class="lab">B · One-liner</p>${header}
    <p class="oneliner"><b>${count} incidents</b> in the last year —
      <span class="mult" style="color:${multColor}">${mult.toFixed(1)}×</span> what a typical SF spot sees.</p>
    <div class="list">${listHtml(5)}${more}</div></div>`)

  // C — hero number
  row.insertAdjacentHTML('beforeend', `<div class="card"><p class="lab">C · Hero</p>${header}
    <div class="hero"><div class="big">${count}</div><div class="cap">incidents within 300 m, last 12 months</div>
      <span class="pill" style="color:${multColor};border-color:${multColor}">${mult.toFixed(1)}× the city average</span></div>
    <div class="list">${listHtml(5)}${more}</div></div>`)

  // D — comparison bars
  const maxBar=Math.max(count,typical)
  row.insertAdjacentHTML('beforeend', `<div class="card"><p class="lab">D · Compare</p>${header}
    <div class="cmp">
      <div class="r"><span class="nm">This spot</span><div class="tr"><i style="width:${Math.round(100*count/maxBar)}%;background:${multColor}"></i></div><span class="v">${count}</span></div>
      <div class="r"><span class="nm">Typical SF</span><div class="tr"><i style="width:${Math.round(100*typical/maxBar)}%;background:rgba(255,255,255,.3)"></i></div><span class="v" style="color:var(--dim)">${typical}</span></div>
    </div>
    <div class="list">${listHtml(5)}${more}</div></div>`)
}
main()
</script>
</body>
</html>
