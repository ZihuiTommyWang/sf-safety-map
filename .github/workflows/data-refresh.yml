name: Refresh incident data

# The deploy workflow fetches fresh data from DataSF on every run, so a nightly
# refresh is just a nightly redeploy. If the DataSF fetch fails its sanity
# guards, the deploy fails and the previous good deploy stays live.

on:
  schedule:
    - cron: '17 10 * * *' # daily ~03:17 Pacific
  workflow_dispatch:

permissions:
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages deploy (rebuilds data from DataSF)
        run: gh workflow run deploy.yml -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
