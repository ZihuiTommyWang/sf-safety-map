<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Safety Map</title>
    <meta
      name="description"
      content="Free, open-source city crime and safety maps built on real police incident reports. San Francisco and New York City."
    />
    <link rel="canonical" href="https://citysafetymap.com/" />
    <meta name="theme-color" content="#101216" />
    <link rel="icon" type="image/svg+xml" href="/sf/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 10px; padding: 20px; box-sizing: border-box;
        background: #101216; color: #eceef0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      h1 { font-size: 24px; margin: 0 0 2px; letter-spacing: -0.3px; }
      p.sub { margin: 0 0 18px; color: #8e949b; font-size: 14px; text-align: center; }
      a.city { display: block; width: min(360px, 100%); box-sizing: border-box; background: #191c21;
        border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 16px 18px;
        color: #eceef0; text-decoration: none; }
      a.city:hover { border-color: #ffb84d; }
      a.city b { display: block; font-size: 16px; }
      a.city span { color: #8e949b; font-size: 12.5px; }
      footer { margin-top: 22px; color: #8e949b; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>City Safety Map</h1>
    <p class="sub">Free, open-source crime maps built on real police reports.</p>
    <a class="city" href="/sf/">
      <b>San Francisco</b>
      <span>SFPD incident reports via DataSF · refreshed nightly</span>
    </a>
    <a class="city" href="/nyc/">
      <b>New York City</b>
      <span>NYPD incident reports via NYC Open Data · published quarterly</span>
    </a>
    <footer>No ads, no tracking.</footer>
  </body>
</html>
