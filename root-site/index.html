<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Safety Map</title>
    <meta
      name="description"
      content="Free, open-source city crime and safety maps built on real police incident reports. San Francisco and New York City, with more cities coming soon."
    />
    <link rel="canonical" href="https://citysafetymap.com/" />
    <meta name="theme-color" content="#101216" />
    <link rel="icon" type="image/svg+xml" href="/sf/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="City Safety Map" />
    <meta property="og:title" content="City Safety Map" />
    <meta property="og:description" content="Every dot is a real police report. Free crime maps of San Francisco and New York City." />
    <meta property="og:url" content="https://citysafetymap.com/" />
    <meta property="og:image" content="https://citysafetymap.com/sf/og.png" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body { margin: 0; background: #101216; color: #eceef0; box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
      h1 { font-size: 26px; letter-spacing: -0.4px; margin: 0 0 4px; }
      .sub { color: #8e949b; font-size: 14px; margin: 0 0 28px; }
      .cards { display: flex; flex-direction: column; gap: 12px; width: min(380px, 100%); }
      a.card { display: flex; align-items: center; gap: 14px; background: #191c21;
        border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 16px 18px;
        color: #eceef0; text-decoration: none; }
      a.card:hover { border-color: #ffb84d; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #ffb84d;
        box-shadow: 0 0 12px 3px rgba(255, 184, 77, 0.45); flex: none; }
      .card b { display: block; font-size: 16px; }
      .card span { color: #8e949b; font-size: 12.5px; }
      .ghost { display: flex; align-items: center; gap: 14px; border: 1px dashed rgba(255, 255, 255, 0.14);
        border-radius: 10px; padding: 16px 18px; color: #8e949b; font-size: 14px; }
      .ghost i { width: 10px; height: 10px; border-radius: 50%; border: 1px dashed #8e949b; flex: none; }
    </style>
  </head>
  <body>
    <h1>City Safety Map</h1>
    <p class="sub">Real police reports. Free, no ads, no tracking.</p>
    <nav class="cards">
      <a class="card" href="/sf/">
        <span class="dot"></span>
        <span><b>San Francisco</b><span>150,000+ incidents · updated nightly</span></span>
      </a>
      <a class="card" href="/nyc/">
        <span class="dot"></span>
        <span><b>New York City</b><span>950,000+ incidents · updated quarterly</span></span>
      </a>
      <div class="ghost"><i></i>More cities coming soon</div>
    </nav>
  </body>
</html>
